name: Build bundle

# No push trigger on purpose. GitHub runs a push workflow from the copy of the
# file that exists on the pushed branch, and this file only lives on main, so a
# push to backend, frontend, or cli would never fire it. An hourly schedule
# picks up those layer pushes instead.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure git identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Build and push bundle
        run: node scripts/build-bundle.mjs --push
